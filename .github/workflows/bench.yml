name: Bench

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep these in sync with CI and docker images workflow configuration.
        nginx_version:
          - "1.26.3"
          - "1.30.6"
          - "1.31.8"
    env:
      NGINX_VERSION: ${{ matrix.nginx_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Pull docker images
        continue-on-error: true
        run: docker compose pull dev

      - name: Run benchmark suite
        run: docker compose run --rm dev make bench-quick

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-nginx-${{ matrix.nginx_version }}
          if-no-files-found: error
          path: |
            bench/results/latest/summary.json
            bench/results/latest/summary.md
            bench/results/latest/*.json
            bench/results/latest/*.log

  bench-comment:
    if: github.event_name == 'pull_request' && always()
    needs: bench
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bench-results-nginx-*
          path: bench-artifacts

      - name: Update benchmark comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench-results
          path: bench-artifacts/bench-results-nginx-*/summary.md
          message: |
            ## Benchmark Results

            {{{content}}}

            Updated from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
