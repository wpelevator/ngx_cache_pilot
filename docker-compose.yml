services:
  dev:
    image: ghcr.io/wpelevator/ngx-cache-pilot--dev:1.0.0-nginx-${NGINX_VERSION:-1.31.8}
    build:
      context: .
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.31.8}
    working_dir: /workspace
    volumes:
      - .:/workspace
  packaging:
    image: ghcr.io/wpelevator/ngx-cache-pilot--packaging:1.0.2
    build:
      context: .
      dockerfile: Dockerfile.packaging
    working_dir: /workspace
    volumes:
      - .:/workspace
